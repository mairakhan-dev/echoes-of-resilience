<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes - RPG Prototype</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            border: 4px solid #222;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.1);
        }
        canvas {
            background-color: #111;
            display: block;
        }
        #textbox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #555;
            padding: 15px;
            box-sizing: border-box;
            display: none;
            font-size: 16px;
            line-height: 1.4;
            color: #fff;
        }
        #textbox.horror {
            border-color: #800;
            color: #ff4d4d;
            animation: shake 0.2s infinite;
        }
        @keyframes shake {
            0% { transform: translate(-50%, -50% - 2px); }
            50% { transform: translate(-50% + 2px, -50% + 1px); }
            100% { transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div style="margin-bottom: 10px; font-size: 14px; color: #666;">Use WASD / ARROW KEYS to move. Walk to the door to enter.</div>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        <div id="textbox">Press SPACE to continue...</div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const textbox = document.getElementById("textbox");

// Game States: 'EID_OUTSIDE', 'HOUSE_INSIDE', 'CONFRONTATION'
let currentMap = 'EID_OUTSIDE';
let activeMessage = null;
let isDialogueActive = false;

// Player Setup (Classic RPG retro square token placeholder)
const player = {
    x: 100, y: 240,
    size: 32, speed: 4,
    color: "#8cd3ff" // Safe light blue color
};

// Map Objects & Portals
const objects = {
    EID_OUTSIDE: [
        { x: 500, y: 180, w: 64, h: 96, color: "#5c4033", type: "door", label: "Your House Door" },
        { x: 200, y: 100, w: 32, h: 32, color: "#ffd700", type: "friend", label: "Friend" }
    ],
    HOUSE_INSIDE: [
        { x: 300, y: 150, w: 40, h: 40, color: "#800", type: "father", label: "Father" }
    ]
};

// Keyboard Input Routing
const keys = {};
window.addEventListener("keydown", e => { 
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " && isDialogueActive) advanceDialogue();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.size > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.size > rect2.y;
}

function showDialogue(text, isHorror = false) {
    isDialogueActive = true;
    textbox.innerText = text;
    textbox.style.display = "block";
    if (isHorror) textbox.classList.add("horror");
    else textbox.classList.remove("horror");
}

function advanceDialogue() {
    isDialogueActive = false;
    textbox.style.display = "none";
    
    if (currentMap === 'EID_OUTSIDE' && player.x > 450) {
        // Transition scene instantly
        currentMap = 'HOUSE_INSIDE';
        player.x = 50;
        player.y = 240;
        player.color = "#ffffff";
        showDialogue("The door slams shut behind you. The bright sunlight vanishes. It's too quiet inside.", true);
    }
}

function update() {
    if (isDialogueActive) return; // Freeze player movement during narrative text overlays

    let moveX = 0;
    let moveY = 0;

    if (keys["arrowup"] || keys["w"]) moveY = -player.speed;
    if (keys["arrowdown"] || keys["s"]) moveY = player.speed;
    if (keys["arrowleft"] || keys["a"]) moveY = 0, moveX = -player.speed;
    if (keys["arrowright"] || keys["d"]) moveY = 0, moveX = player.speed;

    // Apply basic coordinate movement safely
    player.x += moveX;
    player.y += moveY;

    // Boundary constraints
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;
    if (player.y < 0) player.y = 0;
    if (player.y > canvas.height - player.size) player.y = canvas.height - player.size;

    // Check entity object interactions loop
    const activeObjects = objects[currentMap] || [];
    activeObjects.forEach(obj => {
        if (checkCollision(player, obj)) {
            // Push player back away slightly from solid walls
            player.x -= moveX;
            player.y -= moveY;

            if (obj.type === "friend") {
                showDialogue("Friend: 'Happy Eid! Let's go grab some sweets before sunset!'");
            }
            if (obj.type === "door") {
                showDialogue("You walk up to your front door. It's time to head inside. (Press SPACE to step through)");
            }
            if (obj.type === "father") {
                player.color = "#ff4d4d";
                showDialogue("He turns around. His voice completely tears through the silence. You cannot escape.", true);
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Map Environment Layers
    if (currentMap === 'EID_OUTSIDE') {
        ctx.fillStyle = "#1e2511"; // Mud green outdoor ground shade
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else {
        ctx.fillStyle = "#141010"; // Dark red/wooden indoor house tint floorboards
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Render Stationary Objects
    const activeObjects = objects[currentMap] || [];
    activeObjects.forEach(obj => {
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
        
        // Label rendering overhead
        ctx.fillStyle = "#666";
        ctx.font = "10px monospace";
        ctx.fillText(obj.label, obj.x, obj.y - 5);
    });

    // Draw Interactive Active Player Token
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.size, player.size);
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Spark up execution loops
gameLoop();
</script>
</body>
</html>
